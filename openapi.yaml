openapi: 3.0.3
info:
  title: SkyDesk Backend API
  version: 1.0.0
  description: |
    Travel & Expense backend API. All business endpoints require a JWT
    obtained from the auth service (owned separately) and sent as
    `Authorization: Bearer <token>`. Token payload shape: `{ sub: userId, role }`.

    Every response follows one of two shapes:
    - Success: `{ "data": ... }` (optionally with `"pagination"` on list endpoints)
    - Error: `{ "error": { "code": "...", "message": "...", "details": [...] } }`

servers:
  - url: http://localhost:4000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
            details:
              type: array
              items:
                type: object

    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        bookingId: { type: string, format: uuid, nullable: true }
        date: { type: string, format: date-time }
        category: { type: string, enum: [flight, hotel, meals, transit, other] }
        merchant: { type: string }
        description: { type: string }
        amount: { type: number }
        status: { type: string, example: Logged }

    Trip:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        destination: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { type: string, enum: [Upcoming, Completed] }

    Advance:
      type: object
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid, nullable: true }
        purpose: { type: string }
        requestedOn: { type: string, format: date-time }
        amount: { type: number }
        adjusted: { type: number }
        status: { type: string, enum: [Pending, Settled] }

    WishlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        destination: { type: string }
        code: { type: string }
        price: { type: number }
        image: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        priceDropped: { type: boolean }
        dropAmount: { type: number, nullable: true }

    SavedFlight:
      type: object
      properties:
        id: { type: string, format: uuid }
        airline: { type: string }
        flightNo: { type: string }
        from: { type: string }
        to: { type: string }
        depart: { type: string }
        arrive: { type: string }
        duration: { type: string }
        stops: { type: string }
        price: { type: number }
        cabin: { type: string }

    Offer:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        code: { type: string }
        discount: { type: string, nullable: true }
        badge: { type: string, nullable: true }
        gradient: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }

    FlightListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        airline: { type: string }
        code: { type: string }
        from: { type: string }
        to: { type: string }
        depart: { type: string }
        arrive: { type: string }
        duration: { type: string }
        stops: { type: string, enum: [Non-stop, 1 stop, 2+ stops] }
        price: { type: number }
        cabin: { type: string }
        international: { type: boolean }
        tag: { type: string, nullable: true }

    WalletSummary:
      type: object
      properties:
        balance: { type: number }
        cards:
          type: array
          items: { $ref: '#/components/schemas/SavedCard' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/WalletTransaction' }

    SavedCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: Visa }
        last4: { type: string, example: "4471" }
        expiry: { type: string, example: "08/28" }
        holder: { type: string }
        primary: { type: boolean }

    WalletTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [credit, debit] }
        amount: { type: number }
        date: { type: string, format: date-time }
        status: { type: string }

    DashboardSummary:
      type: object
      properties:
        totalSpendYtd: { type: number }
        thisMonthSpend: { type: number }
        outstandingAdvances: { type: number }
        upcomingFlights: { type: integer }

    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, employee] }

    AuthSession:
      type: object
      properties:
        accessToken: { type: string, description: "Short-lived (15 min). Send as Authorization Bearer on every request." }
        refreshToken: { type: string, description: "Long-lived (30 days). Send only to /auth/refresh or /auth/logout." }
        user: { $ref: '#/components/schemas/AuthUser' }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [expense, trip, advance, wallet, system] }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      summary: Liveness check
      security: []
      responses:
        '200': { description: Process is alive }

  /health/ready:
    get:
      summary: Readiness check (DB + Redis reachable)
      security: []
      responses:
        '200': { description: Ready to serve traffic }
        '503': { description: Not ready — DB or Redis unreachable }

  /api/v1/dashboard/summary:
    get:
      summary: All 4 dashboard KPI cards in one call
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }

  /api/v1/auth/signup:
    post:
      summary: Create a new account
      description: >-
        Creates the account and sends a welcome email — it does NOT issue a
        session. The person signs in separately afterwards via /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: "Must contain at least one letter and one number" }
      responses:
        '201':
          description: Account created (no session issued — sign in separately)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthUser' }
        '400': { description: Validation failed }
        '409': { description: Email already registered }

  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
        '401': { description: Invalid email or password }

  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new access + refresh token pair
      description: The old refresh token is revoked immediately upon use (rotation) — reusing it will fail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
        '401': { description: Refresh token invalid, expired, or already used }

  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token (log out)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Logged out }

  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset email
      description: >-
        Always returns the same generic response whether or not the email
        matches an account, to avoid leaking which emails are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Generic acknowledgement (see description) }

  /api/v1/auth/reset-password:
    post:
      summary: Reset password using the token emailed by /auth/forgot-password
      description: On success, all existing refresh tokens for the user are revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, description: "Must contain at least one letter and one number" }
      responses:
        '200': { description: Password updated }
        '400': { description: Token invalid, expired, or already used }

  /api/v1/auth/me:
    get:
      summary: Get the current logged-in user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthUser' }

  /api/v1/notifications:
    get:
      summary: List recent notifications, with unread count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unreadCount: { type: integer }

  /api/v1/notifications/unread-count:
    get:
      summary: Just the unread count, for a lightweight badge poll
      responses:
        '200': { description: OK }

  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark one notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Marked as read }
        '404': { description: Not found }

  /api/v1/notifications/read-all:
    patch:
      summary: Mark every notification as read
      responses:
        '204': { description: All marked as read }

  /api/v1/trips:
    get:
      summary: List the current user's trips
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
    post:
      summary: Create a trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, destination, startDate, endDate]
              properties:
                title: { type: string }
                destination: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/trips/{id}:
    get:
      summary: Get trip detail — itinerary, expenses, and computed total
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '404': { description: Trip not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a trip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Trip not found }

  /api/v1/expenses:
    get:
      summary: List expenses (paginated, filterable)
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [flight, hotel, meals, transit, other] }
        - name: tripId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
    post:
      summary: Create an expense
      description: |
        Supports an optional `Idempotency-Key` header — if the same key is
        sent twice, the second request returns the original response
        instead of creating a duplicate expense.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, category, merchant, amount]
              properties:
                date: { type: string, format: date, example: "2026-07-18" }
                category: { type: string, enum: [flight, hotel, meals, transit, other] }
                merchant: { type: string }
                description: { type: string }
                amount: { type: number, example: 250 }
                tripId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Expense' }
        '400': { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/expenses/{id}:
    get:
      summary: Get one expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    delete:
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }

  /api/v1/expenses/spend-over-time:
    get:
      summary: Spend over time, for the Weekly/Monthly/Yearly chart
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [week, month, year], default: month }
      responses:
        '200': { description: OK }

  /api/v1/expenses/category-spend-over-time:
    get:
      summary: Spend by category over time, for the stacked chart
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [week, month, year], default: month }
      responses:
        '200': { description: OK }

  /api/v1/expenses/category-breakdown:
    get:
      summary: Category breakdown for the pie chart
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }

  /api/v1/advances:
    get:
      summary: List advances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Advance' }
    post:
      summary: Request an advance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, amount]
              properties:
                purpose: { type: string }
                amount: { type: number }
                tripId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed }

  /api/v1/advances/outstanding:
    get:
      summary: Total outstanding advance balance
      responses:
        '200': { description: OK }

  /api/v1/wishlist:
    get:
      summary: List the caller's wishlisted destinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WishlistItem' }
    post:
      summary: Add a destination to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code, price]
              properties:
                destination: { type: string }
                code: { type: string }
                price: { type: number }
                image: { type: string }
                reason: { type: string }
                priceDropped: { type: boolean }
                dropAmount: { type: number }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed }

  /api/v1/wishlist/{id}:
    delete:
      summary: Remove a destination from the wishlist
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }

  /api/v1/saved-flights:
    get:
      summary: List the caller's saved/bookmarked flights
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SavedFlight' }
    post:
      summary: Save a flight itinerary (e.g. from search results)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [airline, flightNo, from, to, depart, arrive, duration, stops, price]
              properties:
                airline: { type: string }
                flightNo: { type: string }
                from: { type: string }
                to: { type: string }
                depart: { type: string }
                arrive: { type: string }
                duration: { type: string }
                stops: { type: string }
                price: { type: number }
                cabin: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed }

  /api/v1/saved-flights/{id}:
    delete:
      summary: Remove a saved flight
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }

  /api/v1/offers:
    get:
      summary: List current promotional offers (global, not per-user)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Offer' }

  /api/v1/flights/search:
    get:
      summary: Search the seeded flight listing inventory
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: international
          in: query
          schema: { type: boolean }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: stops
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: airline
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: sort
          in: query
          schema: { type: string, enum: [best, cheapest, fastest], default: best }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FlightListing' }

  /api/v1/wallet:
    get:
      summary: Wallet summary — balance, cards, and transactions in one call
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WalletSummary' }

  /api/v1/wallet/cards:
    get:
      summary: List saved cards
      responses:
        '200': { description: OK }
    post:
      summary: Add a saved card
      description: Only the last 4 digits of the submitted card number are ever persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardNumber, expiry, holder]
              properties:
                cardNumber: { type: string, example: "4111111111111111" }
                type: { type: string, enum: [Visa, Mastercard, Amex, RuPay] }
                expiry: { type: string, example: "08/28" }
                holder: { type: string }
                primary: { type: boolean }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed }

  /api/v1/wallet/cards/{id}:
    delete:
      summary: Remove a saved card
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }

  /api/v1/wallet/transactions:
    get:
      summary: Wallet transaction ledger
      responses:
        '200': { description: OK }

  /api/v1/wallet/top-up:
    post:
      summary: Top up wallet balance
      description: Supports an optional `Idempotency-Key` header to prevent duplicate top-ups on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
      responses:
        '201': { description: Created }

  /api/v1/bookings:
    get:
      summary: List bookings
      parameters:
        - name: tripId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    post:
      summary: Create a booking (flight, hotel, or cab)
      description: >-
        Sends a booking-confirmed email on success, or a booking-failed
        email if creation throws (e.g. validation error) — either way the
        person gets notified by email, not just via the API response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [flight, hotel, cab] }
                tripId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed }

  /api/v1/bookings/{id}:
    delete:
      summary: Delete a booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
