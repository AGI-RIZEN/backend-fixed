name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skydesk
          POSTGRES_PASSWORD: skydesk
          POSTGRES_DB: skydesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skydesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://skydesk:skydesk@localhost:5432/skydesk_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build check (syntax/import validation)
        run: node --check src/server.js

      - name: Seed test database
        run: npm run seed

      - name: Start server and run smoke test
        run: |
          npm run dev &
          npx wait-on http://localhost:4000/health/live -t 15000
          chmod +x scripts/smoke-test.sh
          BASE_URL=http://localhost:4000 ./scripts/smoke-test.sh

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t skydesk-backend:ci .
